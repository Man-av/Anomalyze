<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark card background matching the dark-mode canvas -->
  <rect width="64" height="64" rx="14" fill="#0C0A09"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#262626" stroke-width="1"/>

  <!-- Subtle grid baseline -->
  <line x1="12" y1="48" x2="52" y2="48" stroke="#262626" stroke-width="2" stroke-linecap="round"/>

  <!-- Anomaly alert pulse glow -->
  <circle cx="34" cy="18" r="9" fill="#FF5722" fill-opacity="0.25"/>

  <!-- Data stream / Trend line with outlier spike -->
  <path d="M 12 42 Q 22 41 27 34 L 34 18 L 41 38 Q 47 42 52 40" 
        stroke="#6366F1" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Dashed drop-line connecting outlier to baseline -->
  <line x1="34" y1="24" x2="34" y2="48" stroke="#E28A36" stroke-width="2" stroke-dasharray="2 3" opacity="0.75"/>

  <!-- The Flagged Anomaly Point -->
  <circle cx="34" cy="18" r="4.5" fill="#E28A36" stroke="#FFFFFF" stroke-width="2"/>
</svg>
